[package]
name = "nib"
version = "0.1.0"
description = "Nib: a tiny Python editor for beginners (spike)"
license = "MIT"
edition = "2024"

[lib]
name = "nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
