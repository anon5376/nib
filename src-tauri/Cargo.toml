[package]
name = "editor-spike"
version = "0.0.1"
description = "Throwaway spike: a tiny Python editor for beginners"
license = "MIT"
edition = "2024"

[lib]
name = "editor_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
